<html lang="fr">

    <meta charset="UTF-8" />

    <meta name="theme-color" content="#F1F3F8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:site_name" content="Event509" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Event509 — Découvrez des événements" />
    <meta property="og:description" content="Découvrez des événements. Obtenez votre billet. Soyez là." />

    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Appliquer le thème avant le premier rendu pour éviter un flash clair en mode sombre
      try {
        var t = JSON.parse(localStorage.getItem('e509.theme') || '"system"');
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>

    <noscript>Event509 nécessite JavaScript. / Event509 requires JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
